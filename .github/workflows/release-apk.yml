# Builds the signed APK and publishes it as a GitHub Release when a version tag (v0.1.0, v0.1.1, ...) is pushed.
# The tag must match the version in pubspec.yaml (version: 0.1.1+2 -> tag v0.1.1).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pubspec.yaml
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # Without the key, Gradle would sign with the debug key: refuse instead
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD or APK_KEY_ALIAS secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apk.jks"
          {
            echo "storeFile=$RUNNER_TEMP/apk.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="gift-exchange-$GITHUB_REF_NAME.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # Same file under a fixed name: .../releases/latest/download/gift-exchange.apk always gives the newest version
          cp "$apk" gift-exchange.apk
          gh release create "$GITHUB_REF_NAME" gift-exchange.apk "$apk" "$apk.sha256" \
            --title "Gift Exchange $GITHUB_REF_NAME" \
            --notes "Android APK. Download **$apk**, open it on your phone and allow installation from this source."
